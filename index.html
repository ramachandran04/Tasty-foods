<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasty-Foods</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&family=Titan+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="main-container">
      <div class="container">
        <span class="timing">
          <i class="fa-regular fa-clock"></i>
          Mon-Fri:8am-11pm, Sat-Sun:8am-12pm
        </span>

        <div class="information">
          <ul>
            <li>About Us</li>
            <li>Contact Us</li>
            <li>Login/Register</li>
          </ul>
        </div>
      </div>
    </div>

    <hr />

    <!-------------------------------------nav-bar------------------------------------------->

    <div class="nav-container">
      <div class="container">
        <div class="logo">
          <span class="top-logo">Tasty</span>
          <span class="bottom-logo">Foods</span>
        </div>

        <nav class="nav-list">
          <ul>
            <li><a href="#home">Home</a></li>
            <li>
              <a href="#Menu">Menu</a>
              <i class="fa-solid fa-angle-down"></i>
            </li>
            <li><a href="#OrderFood">Order Food</a></li>
            <li>
              <a href="#Blog">Blog</a>
              <i class="fa-solid fa-angle-down"></i>
            </li>
            <li>
              <a href="#Pages">Pages</a>
              <i class="fa-solid fa-angle-down"></i>
            </li>
          </ul>
        </nav>

        <div class="nav-actions">
          <div class="contact-info">
            <div id="callus-icon">
              <i class="fa-solid fa-phone-volume"></i>
            </div>

            <div class="phone-text">
              <span id="callus"> Call us for Order </span>
              <span id="call-number"> +1-555-157-5651 </span>
            </div>
          </div>
          <span id="delieverylogo">
            <i class="fa-solid fa-box-archive"></i>
          </span>
          <span id="orderonline">Order Online</span>
        </div>
      </div>
    </div>
  </body>
</html>
